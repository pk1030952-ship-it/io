name: Portfolio browser UI smoke test

on:
  workflow_dispatch:
  push:
    branches: [feature/pankaj-jii-portfolio-v1]
    paths:
      - scripts/ui-smoke.cjs
      - .github/workflows/ui-smoke.yml

permissions:
  contents: read

jobs:
  browser:
    name: Desktop mobile and admin UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Run real Chromium browser checks
        run: node scripts/ui-smoke.cjs
